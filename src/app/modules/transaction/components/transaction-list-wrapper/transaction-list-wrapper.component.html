<div class="transaction-list-wrapper">
  @if (loading()) {
  <mat-progress-bar mode="indeterminate" />
  }

  <transaction-list
    [tableData]="data()"
    (actionTriggered)="triggerAction($event)"
  />

  <button
    mat-fab
    extended
    color="primary"
    class="add-fab"
    (click)="navigate(['transaction/add'])"
  >
    <mat-icon>add</mat-icon>
    Add
  </button>
</div>
