<div class="transaction-table">
  @if (tableData.length > 0) {
  <div class="table-scroll">
    <table mat-table matSort [dataSource]="dataSource">
      <ng-container matColumnDef="col-title">
        <th mat-header-cell mat-sort-header="title" *matHeaderCellDef>
          Title
        </th>
        <td mat-cell *matCellDef="let element">{{ element.title }}</td>
      </ng-container>

      <ng-container matColumnDef="col-account">
        <th mat-header-cell mat-sort-header="account" *matHeaderCellDef>
          Account
        </th>
        <td mat-cell *matCellDef="let element">{{ element.account.name }}</td>
      </ng-container>

      <ng-container matColumnDef="col-amount">
        <th mat-header-cell mat-sort-header="amount" *matHeaderCellDef>
          Amount
        </th>
        <td mat-cell *matCellDef="let element">
          {{ element.amount | currency }}
        </td>
      </ng-container>

      <ng-container matColumnDef="col-date">
        <th mat-header-cell mat-sort-header="date" *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let element">
          {{ element.date | date : "longDate" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="col-category">
        <th mat-header-cell mat-sort-header="category" *matHeaderCellDef>
          Category
        </th>
        <td mat-cell *matCellDef="let element">{{ element.category }}</td>
      </ng-container>

      <ng-container matColumnDef="col-actions" stickyEnd>
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <button
            mat-icon-button
            [matMenuTriggerFor]="menu"
            #menuTrigger="matMenuTrigger"
            (click)="menuTrigger.openMenu()"
            [attr.aria-label]="'Actions for ' + element.title"
          >
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <span (mouseleave)="menuTrigger.closeMenu()">
              <button
                mat-menu-item
                (click)="
                  onClickEmitAction({
                    action: 'ACTION_EDIT',
                    item: element
                  })
                "
              >
                Edit
              </button>
              <button
                mat-menu-item
                (click)="
                  onClickEmitAction({
                    action: 'ACTION_DELETE',
                    item: element
                  })
                "
              >
                Delete
              </button>
            </span>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons
  ></mat-paginator>
  } @else {
  <p class="empty-state">No transactions yet.</p>
  }
</div>
