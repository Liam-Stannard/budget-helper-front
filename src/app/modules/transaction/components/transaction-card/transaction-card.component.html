<mat-card class="transaction-card flex">
  <mat-card-header>
    <mat-card-title>Transaction</mat-card-title>
  </mat-card-header>
  <br />
  <mat-card-content>
    <form [formGroup]="form" class="flex flex-row-start gap-20">
      <div class="flex flex-col-center gap-20 flex-grow">
        <mat-form-field appearance="outline">
          <mat-label>Title</mat-label>
          <input
            matInput
            id="title"
            name="title"
            [formControl]="form.controls.title"
            minlength="1"
            maxlength="32"
          />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Amount</mat-label>
          <input
            matInput
            type="text"
            id="amount"
            name="amount"
            [formControl]="form.controls.amount"
            minlength="1"
            maxlength="32"
          />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Date</mat-label>
          <input
            matInput
            type="text"
            id="date"
            name="date"
            [formControl]="form.controls.date"
            minlength="10"
            maxlength="10"
          />
        </mat-form-field>
      </div>
      <div class="flex flex-col-center gap-20 flex-grow">
        <mat-form-field>
          <mat-label>Category</mat-label>
          <mat-select
            [formControl]="form.controls.category"
            [compareWith]="displayOptionCompare"
          >
            @for (category of categoryOptions; track category) {
            <mat-option [value]="category.value">{{
              category.view
            }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Account</mat-label>
          <input
            matInput
            type="text"
            id="account"
            name="account"
            [formControl]="form.controls.account"
            minlength="1"
            maxlength="32"
          />
        </mat-form-field>
      </div>
    </form>
  </mat-card-content>
  <mat-card-actions class="flex flex-row-end">
    <button mat-raised-button color="primary" (click)="submit()">Submit</button>
  </mat-card-actions>
</mat-card>
