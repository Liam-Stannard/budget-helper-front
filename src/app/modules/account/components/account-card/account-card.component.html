<mat-card class="account-card flex">
  @if (loading()) {
  <mat-progress-bar mode="indeterminate" />
  }

  <mat-card-header>
    <mat-card-title>Account</mat-card-title>
  </mat-card-header>
  @if (!loading()) {
  <mat-card-content>
    <form
      [formGroup]="form"
      class="flex flex-col-start"
      (ngSubmit)="submit()"
    >
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input
          matInput
          id="name"
          name="name"
          [formControl]="form.controls.name"
          minlength="1"
          maxlength="32"
        />
        @if (form.controls.name.hasError('required')) {
        <mat-error>Name is required</mat-error>
        } @else if (form.controls.name.hasError('pattern')) {
        <mat-error>Name contains invalid characters</mat-error>
        }
      </mat-form-field>

      <mat-card-actions class="flex flex-row-end gap-20">
        <button mat-button type="button" (click)="back()">Cancel</button>
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="form.invalid"
        >
          Submit
        </button>
      </mat-card-actions>
    </form>
  </mat-card-content>
  }
</mat-card>
