<mat-card class="flex flex-col-center login">
  <mat-card-header>
    <mat-card-title class="login-title">Login</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form
      [formGroup]="form"
      class="flex flex-col-start"
      (ngSubmit)="login()"
    >
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input
          matInput
          id="username"
          name="username"
          [formControl]="form.controls.username"
        />
        <mat-error *ngIf="form.controls.username.hasError('required')">
          Username is required
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          id="password"
          name="password"
          [formControl]="form.controls.password"
        />
        <mat-error *ngIf="form.controls.password.hasError('required')">
          Password is required
        </mat-error>
      </mat-form-field>

      <mat-card-actions>
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="form.invalid"
        >
          Submit
        </button>
      </mat-card-actions>
    </form>
  </mat-card-content>
</mat-card>
