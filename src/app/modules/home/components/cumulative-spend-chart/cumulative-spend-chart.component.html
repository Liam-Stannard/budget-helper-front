<mat-card class="chart-card">
@if (currentMonth.length === 0 && previousMonth.length === 0) {
<p class="empty-state">No transactions yet.</p>
} @else {
<div class="legend">
  <span class="legend-item">
    <span class="swatch current"></span>
    This month
  </span>
  <span class="legend-item">
    <span class="swatch previous"></span>
    Last month
  </span>
</div>

<svg
  class="chart-svg"
  [attr.viewBox]="viewBox"
  preserveAspectRatio="none"
  role="img"
  [attr.aria-label]="ariaLabel"
>
  <line
    class="baseline"
    x1="0"
    [attr.y1]="baselineY"
    [attr.x2]="viewWidth"
    [attr.y2]="baselineY"
  />

  @if (previousPoints.length > 1) {
  <polyline
    class="line previous"
    [attr.points]="toPolylinePoints(previousPoints)"
  />
  } @else if (previousPoints.length === 1) {
  <circle
    class="dot previous"
    [attr.cx]="previousPoints[0].x"
    [attr.cy]="previousPoints[0].y"
    r="3"
  >
    <title>{{ pointLabel(previousPoints[0]) }}</title>
  </circle>
  }

  @if (currentPoints.length > 1) {
  <polyline
    class="line current"
    [attr.points]="toPolylinePoints(currentPoints)"
  />
  } @else if (currentPoints.length === 1) {
  <circle
    class="dot current"
    [attr.cx]="currentPoints[0].x"
    [attr.cy]="currentPoints[0].y"
    r="3"
  >
    <title>{{ pointLabel(currentPoints[0]) }}</title>
  </circle>
  }
</svg>
}
</mat-card>
