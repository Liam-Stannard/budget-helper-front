<h1 class="mat-h1">{{ currentMonthLabel }}</h1>

@if (loading()) {
<mat-progress-bar mode="indeterminate" />
}

@if (!loading()) {
<div class="stat-row">
  <app-stat-tile
    label="Income this month"
    [value]="(summary().income | currency)!"
  />
  <app-stat-tile
    label="Spent this month"
    [value]="(summary().spent | currency)!"
    [delta]="spentDeltaText()"
    [deltaIsGood]="spentDeltaIsGood()"
  />
  <app-stat-tile
    label="Net this month"
    [value]="(summary().net | currency)!"
    [delta]="savingsText()"
    [deltaIsGood]="summary().savingsRate === undefined ? undefined : summary().net >= 0"
  />
  @if (accountsLoaded()) {
  <app-stat-tile
    label="Net worth"
    [value]="(netWorth() | currency)!"
    [delta]="accounts().length + (accounts().length === 1 ? ' account' : ' accounts')"
  />
  }
</div>

<div class="dashboard-grid">
  <app-budget-progress
    class="span-2"
    [rows]="budgetRows()"
    [monthElapsedPercent]="monthElapsedPercent()"
  />
  <app-spending-pace [pace]="pace()" [totalBudget]="totalBudget()" />
  <app-recent-transactions class="span-2" [transactions]="recentTransactions()" />
  <div class="stack">
    <app-bills-due [bills]="billsDue()" />
    @if (accountsLoaded()) {
    <app-account-balances [accounts]="accounts()" />
    }
  </div>
</div>
}
