<mat-card class="flex-center-col login">
  <mat-card-header>
    <mat-card-title class="login-title">{{ data.name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content> </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="edit()">Edit</button>
    <button mat-stroked-button color="primary" (click)="delete()">
      Delete
    </button>
  </mat-card-actions>
</mat-card>
