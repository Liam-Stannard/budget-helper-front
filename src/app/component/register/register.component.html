<mat-card class="flex flex-col-center register">
  <mat-card-header>
    <mat-card-title class="register-title">Register</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" class="flex flex-col-start">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input
          matInput
          id="username"
          name="username"
          [formControl]="form.controls.username"
        />
        <mat-error *ngIf="form.controls.username.hasError('required')">
          Username is required
        </mat-error>
        <mat-error *ngIf="form.controls.username.hasError('minlength')">
          Username must be at least 3 characters
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          id="password"
          name="password"
          [formControl]="form.controls.password"
        />
        <mat-error *ngIf="form.controls.password.hasError('required')">
          Password is required
        </mat-error>
        <mat-error *ngIf="form.controls.password.hasError('minlength')">
          Password must be at least 6 characters
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Confirm Password</mat-label>
        <input
          matInput
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [formControl]="form.controls.confirmPassword"
        />
        <mat-error *ngIf="form.controls.confirmPassword.hasError('required')">
          Please confirm your password
        </mat-error>
        <mat-error
          *ngIf="
            form.hasError('passwordsMismatch') &&
            !form.controls.confirmPassword.hasError('required')
          "
        >
          Passwords do not match
        </mat-error>
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions class="flex flex-col-center gap-20">
    <button mat-raised-button color="primary" (click)="register()">
      Submit
    </button>
    <a routerLink="/login">Already have an account? Login</a>
  </mat-card-actions>
</mat-card>
